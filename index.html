const un = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function abrir(senha) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(senha), 'PBKDF2', false, ['deriveKey']);
  const chave = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: un(P.sal), iterations: P.it, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: un(P.iv) }, chave, un(P.dados)));
  try { localStorage.setItem('revisao-senha', senha); } catch (e) {}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').onsubmit = async ev => {
  ev.preventDefault();
  try { await abrir(document.getElementById('s').value.trim()); }
  catch (e) { document.getElementById('e').textContent = 'Senha errada. Tente de novo.'; }
};
let guardada = null;
try { guardada = localStorage.getItem('revisao-senha'); } catch (e) {}
if (guardada) abrir(guardada).catch(() => { try { localStorage.removeItem('revisao-senha'); } catch (e) {} });
